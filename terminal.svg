<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" font-family="'Cascadia Code', 'Consolas', monospace" font-size="13">
  <!-- Window frame -->
  <rect width="720" height="320" rx="8" fill="#0C0C0C"/>
  <!-- Title bar (Windows 11 style) -->
  <rect width="720" height="32" rx="8" fill="#202020"/>
  <rect y="14" width="720" height="18" fill="#202020"/>
  <!-- Tab -->
  <rect x="8" y="6" width="140" height="22" rx="4" fill="#181818"/>
  <text x="48" y="21" fill="#CCCCCC" font-size="11">PowerShell</text>
  <!-- Window controls -->
  <text x="640" y="21" fill="#999" font-size="14">─ □ ×</text>

  <!-- Content -->
  <text x="16" y="60">
    <rect x="16" y="48" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 启动: </tspan>
    <tspan fill="#CCCCCC">FuckWeici 已启动</tspan>
  </text>

  <text x="16" y="84">
    <rect x="16" y="72" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 环境: </tspan>
    <tspan fill="#CCCCCC">设备=emulator-5554</tspan>
  </text>

  <text x="16" y="108">
    <rect x="16" y="96" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 环境: </tspan>
    <tspan fill="#CCCCCC">题库=db/weici_ext459.db</tspan>
  </text>

  <text x="16" y="132">
    <rect x="16" y="120" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 环境: </tspan>
    <tspan fill="#CCCCCC">答题间隔=0.50s 包名=com.android.weici.senior.student</tspan>
  </text>

  <text x="16" y="156">
    <rect x="16" y="144" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 提示: </tspan>
    <tspan fill="#CCCCCC">进入维词答题界面后确认开始</tspan>
  </text>

  <text x="16" y="188">
    <rect x="16" y="176" width="42" height="18" rx="3" fill="#F9E2AF"/>
    <tspan fill="#0C0C0C" font-weight="bold"> WARN </tspan>
    <tspan fill="#94A3B8"> 等待: </tspan>
    <tspan fill="#CCCCCC">请把设备停留在答题界面。准备好后按回车。</tspan>
  </text>

  <text x="16" y="220">
    <rect x="16" y="208" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 题目: </tspan>
    <tspan fill="#CCCCCC">1/100 大杂烩</tspan>
  </text>

  <text x="16" y="244">
    <rect x="16" y="232" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 命中: </tspan>
    <tspan fill="#a6e3a1">faithfully</tspan>
    <tspan fill="#94A3B8"> · 题库直出</tspan>
  </text>

  <text x="16" y="268">
    <rect x="16" y="256" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 题目: </tspan>
    <tspan fill="#CCCCCC">2/100 英译汉</tspan>
  </text>

  <text x="16" y="292">
    <rect x="16" y="280" width="42" height="18" rx="3" fill="#7DD3FC"/>
    <tspan fill="#0C0C0C" font-weight="bold"> INFO </tspan>
    <tspan fill="#94A3B8"> 命中: </tspan>
    <tspan fill="#a6e3a1">注意；专心</tspan>
    <tspan fill="#94A3B8"> · attention</tspan>
  </text>
</svg>
